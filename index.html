<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="pitch">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفارة</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="صفارة">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="whistle">🏟️</span>صفارة</div>
      <div class="status-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">متصل</span>
      </div>
    </div>
    <div class="topbar-sub" id="userGreeting">أهلاً بيك 👋</div>
  </div>

  <!-- Bookings view -->
  <div class="view" id="view-bookings">
    <div class="section-title">المباريات الجاية <span id="adminBadge"></span></div>
    <div id="bookingsList"></div>
  </div>

  <!-- Chat view -->
  <div class="view hidden" id="view-chat">
    <div class="chat-wrap">
      <div class="section-title">دردشة الشلة</div>
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input id="chatInput" type="text" placeholder="اكتب رسالة..." maxlength="500">
        <button class="chat-send" id="chatSendBtn">↩</button>
      </div>
    </div>
  </div>

  <!-- Settings view -->
  <div class="view hidden" id="view-settings">
    <div class="section-title">الإعدادات</div>

    <div class="settings-card">
      <h3>بروفايلك</h3>
      <div class="photo-pick">
        <div class="photo-preview" id="profilePhotoPreview">👤</div>
        <div style="flex:1">
          <div class="field"><input id="settingsName" type="text" placeholder="اسمك"></div>
        </div>
      </div>
      <div class="field"><label>رقم الموبايل</label><input id="settingsPhone" type="tel" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label>رقم الواتساب</label><input id="settingsWhatsapp" type="tel" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label>الصورة الشخصية (اختياري)</label><input id="settingsPhotoFile" type="file" accept="image/*"></div>
      <button class="btn-primary btn-block" id="saveProfileBtn">حفظ البروفايل</button>
    </div>

    <div class="settings-card">
      <h3>ثيم التطبيق</h3>
      <div class="theme-row">
        <button class="theme-swatch" data-theme="pitch">ملعب 🌿</button>
        <button class="theme-swatch" data-theme="night">ليلي 🌙</button>
        <button class="theme-swatch" data-theme="day">نهاري ☀️</button>
      </div>
    </div>

    <div class="settings-card" id="adminCard">
      <h3>دخول الأدمن</h3>
      <div id="adminLoggedOut">
        <div class="field"><input id="adminCodeInput" type="password" placeholder="كود الأدمن"></div>
        <button class="btn-secondary btn-block" id="adminLoginBtn">تسجيل الدخول كأدمن</button>
      </div>
      <div id="adminLoggedIn" class="hidden">
        <span class="admin-badge">✅ أنت أدمن التطبيق</span>
      </div>
    </div>

    <div class="settings-card">
      <h3>عن التطبيق</h3>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.9">
        صفارة — تطبيق شلة الكورة لحجز الملاعب والتصويت والدردشة.<br>
        محتاج نت عشان الرسايل والتحديثات توصلك أول بأول.
      </div>
    </div>
  </div>

  <!-- FAB (new booking, admin only, shown on bookings tab) -->
  <div class="fab hidden" id="fabNewBooking">
    <button class="btn-primary" id="openNewBookingBtn">+ حجز جديد</button>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-btn active" data-view="bookings"><span class="icon">📋</span>الحجوزات</button>
    <button class="nav-btn" data-view="chat"><span class="icon">💬</span>الدردشة</button>
    <button class="nav-btn" data-view="settings"><span class="icon">⚙️</span>الإعدادات</button>
  </div>

  <!-- Registration overlay (first run) -->
  <div class="overlay" id="registerOverlay">
    <div class="sheet">
      <div class="sheet-title">قبل ما تدخل... عرّفنا بيك 👋</div>
      <div class="photo-pick">
        <div class="photo-preview" id="regPhotoPreview">👤</div>
        <div style="flex:1">
          <div class="field"><label>الصورة (اختياري)</label><input id="regPhotoFile" type="file" accept="image/*"></div>
        </div>
      </div>
      <div class="field"><label>اسمك *</label><input id="regName" type="text" placeholder="اسمك في الشلة"></div>
      <div class="field"><label>رقم الموبايل</label><input id="regPhone" type="tel" placeholder="01xxxxxxxxx"></div>
      <div class="field"><label>رقم الواتساب</label><input id="regWhatsapp" type="tel" placeholder="01xxxxxxxxx"></div>
      <button class="btn-primary btn-block" id="registerBtn">يلا نبدأ ⚽</button>
    </div>
  </div>

  <!-- New booking overlay -->
  <div class="overlay hidden" id="newBookingOverlay">
    <div class="sheet">
      <div class="sheet-title">حجز ملعب جديد</div>
      <div class="field"><label>اسم الملعب *</label><input id="nbField" type="text" placeholder="مثال: ملعب النادي الأهلي"></div>
      <div class="field"><label>العنوان *</label><input id="nbAddress" type="text" placeholder="عنوان الملعب"></div>
      <div class="field-row">
        <div class="field"><label>السعر (ج.م) *</label><input id="nbPrice" type="number" placeholder="0"></div>
        <div class="field"><label>العدد المطلوب *</label><input id="nbCapacity" type="number" placeholder="10"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>التاريخ *</label><input id="nbDate" type="date"></div>
        <div class="field"><label>الميعاد</label><input id="nbTime" type="time"></div>
      </div>
      <div class="field"><label>ملاحظات</label><textarea id="nbNotes" rows="2" placeholder="أي تفاصيل زيادة..."></textarea></div>
      <div class="sheet-actions">
        <button class="btn-secondary" id="cancelNewBookingBtn">إلغاء</button>
        <button class="btn-primary btn-block" id="submitNewBookingBtn">احجز</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
